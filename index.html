<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공간제작소 관리자</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f4f85">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="공간 관리자">
<style>
  :root {
    --bg:#f4f6fa; --card:#fff; --line:#e3e8f0; --text:#1f2a3a; --mute:#6b7788;
    --navy:#2f4f85; --navy-d:#1f3a5f; --head:#e4ecf7; --green:#5b8a6e; --green-l:#8fbf9f;
    --gray:#b4bcc8; --amber:#e8b765; --red:#c86b6b; --radius:12px;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; font-size:15px; line-height:1.5; }
  a { color:var(--navy); text-decoration:none; }
  button { font:inherit; cursor:pointer; }
  input, select { font:inherit; }
  .hidden { display:none !important; }

  /* ---- 상단 ---- */
  .top { background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  .top .in { max-width:1200px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:14px; }
  .top img { height:30px; display:block; }
  .top .brand { display:flex; align-items:center; gap:8px; text-decoration:none; }
  .top .ttl { font-size:12px; color:var(--mute); font-weight:600; line-height:1.2; }
  .top nav { display:flex; gap:4px; margin-left:12px; }
  .top nav button { border:0; background:transparent; padding:8px 12px; border-radius:8px; color:var(--mute); font-weight:600; }
  .top nav button.on { background:var(--head); color:var(--navy-d); }
  .top nav .badge { display:inline-block; min-width:18px; padding:0 6px; margin-left:4px; border-radius:9px; background:var(--amber); color:#5a4310; font-size:12px; font-weight:700; }
  .top .me { margin-left:auto; display:flex; align-items:center; gap:10px; color:var(--mute); font-size:13px; }
  .top .me b { color:var(--text); }
  /* 좁은 화면: 글자 단위 줄바꿈 대신, 한 줄에 안 들어가면 fitHeader()가 .compact를 붙임 → DB 갱신 시각 숨김 + 권한을 로고 밑으로 */
  .top .brand, .top nav button, .top .me > * { white-space:nowrap; flex-shrink:0; }
  .top.compact #syncInfo { display:none; }
  .top.compact .brand { flex-direction:column; align-items:flex-start; gap:2px; }
  /* 그래도 안 들어가면(휴대폰) .tight: 메뉴 버튼을 둘째 줄로 */
  .top.tight .in { flex-wrap:wrap; row-gap:6px; }
  .top.tight nav { order:3; width:100%; margin-left:0; }
  .role { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:700; background:var(--head); color:var(--navy-d); }
  .role.master, .role.admin, .role.gongmu, .role.pm { background:#efe4c8; color:#5a4310; }
  .role.owner { background:#dfe9e2; color:#2f5b40; }
  .lnk { border:0; background:transparent; color:var(--mute); text-decoration:underline; padding:0; }
  #bug { font-size:12px; text-decoration:none; } #bug.on { color:var(--navy-d); font-weight:600; }

  .wrap { max-width:1200px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
  .center { max-width:420px; margin:60px auto; text-align:center; }
  .center img { height:48px; margin-bottom:16px; }
  .center h1 { font-size:20px; margin:0 0 8px; color:var(--navy-d); }
  .center p { color:var(--mute); margin:0 0 20px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); background:var(--card); padding:10px 16px; border-radius:10px; font-weight:600; color:var(--text); }
  .btn.primary { background:var(--navy); border-color:var(--navy); color:#fff; }
  .btn.sm { padding:6px 10px; font-size:13px; border-radius:8px; }
  .btn:disabled { opacity:.5; cursor:default; }
  .notice { background:#fff7e3; border:1px solid #f1dfae; color:#5a4310; padding:10px 14px; border-radius:10px; font-size:14px; }
  .err { background:#fbeaea; border:1px solid #efc7c7; color:#7a2e2e; padding:10px 14px; border-radius:10px; font-size:14px; }

  /* ---- 목록 ---- */
  .tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  .tools input[type=search] { flex:1 1 220px; min-width:180px; padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); }
  .tools select { padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); }
  .tools.range { margin-top:-4px; }
  .tools.range input[type=date] { padding:7px 10px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .chip { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:4px 10px; font-size:13px; color:var(--mute); }
  .chip b { color:var(--text); margin-left:4px; }
  .chip.on { background:var(--navy); border-color:var(--navy); color:#fff; } .chip.on b { color:#fff; }
  .count { color:var(--mute); font-size:13px; margin:0 0 8px; }

  table.list { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  table.list th, table.list td { padding:10px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; font-size:14px; }
  table.list th { background:var(--head); color:var(--navy-d); font-weight:700; white-space:nowrap; }
  table.list tr:last-child td { border-bottom:0; }
  table.list tbody tr { cursor:pointer; } table.list tbody tr:hover { background:#f7f9fc; }
  .nm { font-weight:700; } .sub { color:var(--mute); font-size:12px; }
  .dots { display:inline-flex; gap:3px; vertical-align:middle; margin-right:8px; }
  .dots i { width:9px; height:9px; border-radius:50%; background:var(--gray); display:inline-block; }
  .dots i.d { background:var(--green-l); } .dots i.n { background:var(--amber); } .dots i.p { background:repeating-linear-gradient(45deg,var(--green-l) 0 2px,#fff 2px 4px); }
  .st { white-space:nowrap; }
  .pct { font-variant-numeric:tabular-nums; }
  .tag { display:inline-block; padding:1px 7px; border-radius:8px; background:var(--head); color:var(--navy-d); font-size:12px; white-space:nowrap; }
  .tag.site { background:#efe4c8; color:#5a4310; }
  .empty { padding:40px; text-align:center; color:var(--mute); }

  /* ---- 상세 ---- */
  .back { margin-bottom:10px; }
  .grid { display:grid; grid-template-columns:1.2fr .8fr; gap:16px; }
  .h { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .h h2 { margin:0; font-size:20px; color:var(--navy-d); }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:14px; }
  .kv dt { color:var(--mute); white-space:nowrap; } .kv dd { margin:0; }
  .sec { margin-top:14px; } .sec h3 { margin:0 0 8px; font-size:14px; color:var(--mute); font-weight:700; letter-spacing:.02em; }
  .stages { display:flex; flex-direction:column; gap:6px; }
  .stg { display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--card); }
  .stg.now { border-color:var(--amber); background:#fffaf0; } .stg.done { color:var(--mute); }
  .stg .m { width:20px; text-align:center; font-weight:700; } .stg.done .m { color:var(--green); } .stg.now .m { color:#b07d1a; }
  .stg .t { flex:1; font-weight:600; } .stg.done .t { font-weight:500; }
  .stg .c { font-size:12px; color:var(--mute); }
  .stg .c.p { color:#b07d1a; }
  .items { margin:4px 0 0 30px; font-size:13px; color:var(--mute); }
  .items span { display:inline-block; margin-right:10px; }
  .items .ok { color:var(--green); } .items .no { color:var(--red); }
  .proc { border:1px solid var(--line); border-radius:10px; margin-bottom:8px; overflow:hidden; }
  .proc summary { padding:8px 12px; cursor:pointer; font-weight:600; display:flex; gap:10px; align-items:center; background:#fafbfd; }
  .proc summary .s { font-weight:400; color:var(--mute); font-size:13px; margin-left:auto; }
  .proc ul { list-style:none; margin:0; padding:6px 12px 10px; font-size:13px; }
  .proc li { display:flex; justify-content:space-between; gap:10px; padding:3px 0; border-bottom:1px dashed var(--line); } .proc li:last-child { border-bottom:0; }
  .proc li .ok { color:var(--green); } .proc li .now { color:#b07d1a; } .proc li .skip { color:var(--gray); text-decoration:line-through; }
  .pay { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .pay .b { border:1px solid var(--line); border-radius:10px; padding:10px; text-align:center; }
  .pay .b .l { font-size:12px; color:var(--mute); } .pay .b .v { font-weight:700; margin-top:2px; }
  .pay .b.done { background:#eef5f0; border-color:#cfe3d6; } .pay .b.partial { background:#fff7e3; border-color:#f1dfae; }
  .ct { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line); font-size:14px; } .ct:last-child { border-bottom:0; }
  .ct .lb { color:var(--mute); width:64px; } .ct a { margin-left:auto; }

  /* ---- 표 만들기 ---- */
  .tbl-wrap { display:grid; grid-template-columns:1fr 250px; gap:12px; align-items:start; }
  .tbl-bar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:8px; font-size:13px; color:var(--mute); }
  .tbl-bar .sp { flex:1; }
  .tbl-scroll { overflow:auto; max-height:calc(100vh - 290px); border:1px solid var(--line); border-radius:var(--radius); background:var(--card); }
  .tbl-scroll table { border:0; border-radius:0; min-width:100%; }
  .tbl-scroll th { position:sticky; top:0; z-index:1; }
  .tbl-scroll td, .tbl-scroll th { white-space:nowrap; }
  .tbl-scroll tbody tr.sel { background:#fffaf0; }
  .tbl-side { position:sticky; top:64px; }
  .tbl-side .card { padding:12px; }
  .cg { margin-top:10px; } .cg-t { font-size:12px; font-weight:700; color:var(--mute); margin-bottom:4px; letter-spacing:.02em; }
  .cg label { display:block; font-size:13px; padding:2px 0; cursor:pointer; } .cg input { margin-right:6px; }
  .presets { display:flex; flex-wrap:wrap; gap:4px; } .presets .chip { padding:3px 9px; }
  .presets .chip.custom { border-style:dashed; }
  @media (max-width: 820px) {
    .tbl-wrap { grid-template-columns:1fr; } .tbl-side { position:static; }
    .tbl-scroll { max-height:60vh; }
    .tbl-scroll table.list thead { display:table-header-group; }
    .tbl-scroll table.list, .tbl-scroll table.list tbody, .tbl-scroll table.list tr, .tbl-scroll table.list td { display:revert; }
    .tbl-scroll table.list td { padding:8px 10px; border-bottom:1px solid var(--line); }
  }

  /* ---- 대화·배지 ---- */
  .ubadge { display:inline-block; margin-left:6px; padding:0 7px; border-radius:9px; background:var(--amber); color:#5a4310; font-size:12px; font-weight:700; vertical-align:middle; }
  .ubadge.call { background:var(--red); color:#fff; }
  .chip.call.on { background:var(--red); border-color:var(--red); }
  .targets { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px; font-size:12px; color:var(--mute); }
  .targets .chip { padding:2px 9px; font-size:12px; } .targets .chip.on { background:var(--navy); border-color:var(--navy); color:#fff; }
  .targets .chip:disabled { opacity:.45; cursor:default; }
  .msg .call-tag { display:inline-block; background:#fbeaea; color:#7a2e2e; border-radius:6px; padding:0 6px; font-size:11px; font-weight:700; margin-bottom:3px; }
  .msg.mine .call-tag { background:#fbeaea; }
  .tog { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--mute); cursor:pointer; white-space:nowrap; }
  .chat .msgs { max-height:380px; overflow:auto; display:flex; flex-direction:column; gap:8px; padding:4px 2px; }
  .msg { max-width:90%; align-self:flex-start; } .msg.mine { align-self:flex-end; text-align:right; }
  .msg .meta { font-size:11px; color:var(--mute); margin-bottom:2px; } .msg .meta .r { background:var(--head); color:var(--navy-d); border-radius:6px; padding:0 5px; }
  .msg .b { display:inline-block; background:#f1f4f9; border-radius:12px; padding:8px 12px; font-size:14px; text-align:left; word-break:break-word; }
  .msg.mine .b { background:var(--navy); color:#fff; }
  .msg .del { border:0; background:transparent; color:var(--mute); cursor:pointer; font-size:13px; padding:0 2px; }
  .day { text-align:center; font-size:11px; color:var(--mute); margin:6px 0 2px; }
  .chat-in { display:flex; gap:6px; margin-top:8px; align-items:flex-end; }
  /* 입력칸: 평소 한 줄(버튼과 같은 38px), 글이 길어지면 5줄(118px)까지 자동으로 늘어남 — growInput() */
  .chat-in textarea { flex:1; min-width:0; resize:none; padding:8px 10px; border:1px solid var(--line); border-radius:10px; font:inherit; line-height:20px; height:38px; max-height:118px; overflow-y:hidden; }
  .chat-in .btn { height:38px; flex-shrink:0; }
  .chat-in .btn.icon { padding:0 10px; }
  .att-pending { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .att-pending .chip { max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .att-pending .chip button { border:0; background:transparent; color:var(--mute); margin-left:4px; cursor:pointer; }
  .att-opt { font-size:12px; color:var(--mute); margin-top:4px; display:flex; gap:10px; align-items:center; }
  .att { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .msg.mine .att { justify-content:flex-end; }
  .att img { width:120px; height:120px; object-fit:cover; border-radius:10px; border:1px solid var(--line); display:block; }
  .att .file { display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border:1px solid var(--line); border-radius:10px; background:#fff; font-size:13px; color:var(--text); max-width:260px; }
  .att .file span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .att .gone { font-size:12px; color:var(--mute); border:1px dashed var(--line); border-radius:10px; padding:6px 10px; }
  .usage { font-size:13px; color:var(--mute); margin-bottom:10px; } .usage b { color:var(--text); }
  .members { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; }
  .mem { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; border:1px solid var(--line); background:#fafbfd; font-size:12px; color:var(--text); }
  .mem .rl { color:var(--mute); } .mem .dot { width:7px; height:7px; border-radius:50%; background:var(--gray); display:inline-block; }
  .mem.on .dot { background:var(--green); } .mem.off { color:var(--mute); border-style:dashed; }
  .mem .note { color:var(--mute); font-size:11px; }

  /* ---- 알림 ---- */
  .bell { position:relative; border:0; background:transparent; font-size:18px; line-height:1; padding:5px 7px; border-radius:8px; }
  .bell.on { background:var(--head); }
  .bell .dot { position:absolute; top:3px; right:3px; width:8px; height:8px; border-radius:50%; background:var(--amber); display:none; }
  .bell.need .dot { display:block; }
  .nt { max-width:640px; margin:0 auto; }
  .nt h2 { margin:0 0 6px; font-size:20px; color:var(--navy-d); }
  .nt .st { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 14px; border-radius:10px; background:#f7f9fc; border:1px solid var(--line); margin-top:12px; white-space:normal; }
  .nt .st.ok { background:#eef5f0; border-color:#cfe3d6; } .nt .st.warn { background:#fff7e3; border-color:#f1dfae; }
  .nt .st .t { flex:1; min-width:200px; font-size:14px; }
  .sw { display:flex; align-items:flex-start; gap:8px; font-size:14px; padding:6px 0; cursor:pointer; }
  .sw input { margin-top:3px; }
  .dev { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:14px; } .dev:last-child { border-bottom:0; }
  .dev .ic { font-size:20px; } .dev .t { flex:1; } .dev .sub { display:block; }
  .steps { margin:6px 0 0; padding-left:20px; font-size:14px; } .steps li { margin:4px 0; }

  /* ---- 관리자 관리 ---- */
  table.list td select { padding:5px 8px; border:1px solid var(--line); border-radius:8px; background:var(--card); }
  .saved { color:var(--green); font-size:12px; margin-left:6px; }

  /* ---- 상세: 좁은 화면에서는 [현장 정보 | 대화] 두 칸을 옆으로 스와이프 ---- */
  .ptabs { display:none; gap:6px; margin-bottom:10px; }
  .ptabs button { flex:1; border:1px solid var(--line); background:var(--card); padding:8px; border-radius:10px; font-weight:600; color:var(--mute); }
  .ptabs button.on { background:var(--navy); border-color:var(--navy); color:#fff; }
  .ptabs button.on .ubadge { background:#fff; color:var(--navy-d); }
  /* ---- 제보 ---- */
  .fb { padding:10px 0; border-bottom:1px dashed var(--line); font-size:14px; } .fb:last-child { border-bottom:0; }
  .fb .meta { font-size:12px; color:var(--mute); margin-bottom:4px; }
  .fb .body { white-space:pre-wrap; word-break:break-word; }
  .fb .reply { margin-top:6px; padding:8px 10px; background:#f1f4f9; border-radius:10px; font-size:13px; }
  .fb .shots { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; } .fb .shots img { width:96px; height:96px; object-fit:cover; border-radius:8px; border:1px solid var(--line); display:block; }
  .tag.st-open { background:#fff7e3; color:#5a4310; } .tag.st-doing { background:var(--head); color:var(--navy-d); } .tag.st-done { background:#eef5f0; color:#2f5b40; }
  .fbform textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font:inherit; resize:vertical; margin-top:8px; }
  .fbform select { padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--card); }

  @media (max-width: 820px) {
    .grid { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; gap:0; margin:0 -16px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
    .grid::-webkit-scrollbar { display:none; }
    .grid > div { flex:0 0 100%; min-width:0; scroll-snap-align:start; padding:0 16px; }
    .ptabs { display:flex; }
    .chat .msgs { max-height:55vh; }
    table.list thead { display:none; }
    table.list, table.list tbody, table.list tr, table.list td { display:block; }
    table.list tr { border-bottom:1px solid var(--line); padding:8px 4px; }
    table.list td { border:0; padding:3px 8px; }
    table.list td.hide-m { display:none; }
    .top nav button { padding:8px 8px; }
    .top .me span.email { display:none; }
  }
</style>
</head>
<body>

<header class="top hidden" id="top">
  <div class="in">
    <a class="brand" href="#sites" title="현장 목록으로"><img src="logo.png" alt="공간제작소"><span class="ttl" id="brandRole">관리자</span></a>
    <nav>
      <button id="navSites" class="on" onclick="go('#sites')">현장 목록</button>
      <button id="navUsers" class="hidden" onclick="go('#users')">관리자 관리<span class="badge hidden" id="pendingBadge"></span></button>
    </nav>
    <div class="me">
      <span id="syncInfo" class="sub"></span>
      <span><b id="meName"></b> <span class="email" id="meEmail"></span></span>
      <button class="bell" id="bell" title="알림 설정" onclick="go('#notify')">🔔<span class="dot"></span></button>
      <button class="lnk" id="bug" title="버그·개선 제보" onclick="go('#feedback')">버그제보</button>
      <button class="lnk" onclick="signOut()">로그아웃</button>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="center card" id="loading"><p>불러오는 중…</p></div>
</main>

<script src="stage-engine.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://ljxonejavjagwqrorfui.supabase.co';

function fitHeader() {

  top.classList.remove('compact', 'tight');
  if (over()) top.classList.add('compact');
  if (over()) top.classList.add('tight');
}

async function loadData() {
  const [sitesRes, staffRes, runRes, roleRes] = await Promise.all([
    sb.from('sites').select('*').order('issue_name'),
    sb.from('staff').select('name, phone'),
    sb.from('sync_runs').select('started_at, finished_at, sites, items').order('id', { ascending:false }).limit(1),
    sb.rpc('role_accounts'),
  ]);
  S.sites = sitesRes.data || [];
  S.roleAccounts = Object.fromEntries((roleRes.data || []).map(r => [r.role, Number(r.n)]));   // 공무·PM 계정 수 (호출 칩 활성용)
  if (S.me.role === 'owner') {
    const [{ count: p }, { count: f }] = await Promise.all([
      sb.from('admin_users').select('id', { count:'exact', head:true }).eq('role', 'pending'),
      sb.from('feedback').select('id', { count:'exact', head:true }).eq('status', 'open'),
    ]);
    S.openFb = f || 0; setBadge((p || 0) + S.openFb);
  }
  S.staff = Object.fromEntries((staffRes.data || []).map(r => [r.name, r.phone]));
  S.lastSync = runRes.data?.[0] || null;
  // 세부공정: 1,000행씩 페이지로 전부 읽기 (RLS가 담당 현장 것만 돌려줌)
  const items = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from('stage_items').select('bm_key, process, stage_key, name, state, seq').order('stage_key').range(from, from + 999);
    if (error || !data?.length) break;
    items.push(...data);
    if (data.length < 1000) break;
  }
  S.itemsBy = {};
  for (const it of items) (S.itemsBy[it.bm_key] ||= []).push(toStage(it));
  await refreshUnread();
  recompute();
  $('#syncInfo').textContent = S.lastSync ? `DB 갱신 ${fmtTime(S.lastSync.finished_at || S.lastSync.started_at)}` : '';
  fitHeader();
}
function recompute() {
  S.computed = S.sites.map(site => { const row = toRow(site); let c = null; try { c = E.compute(row, S.itemsBy[site.bm_key] || []); } catch (e) { console.warn(site.bm_key, e); } return { site, row, c }; });
}

function inDateRange(site) {
  const f = S.filter; if (!f.from && !f.to) return true;
  const v = String(site[f.dateField] || '').slice(0, 10); if (!v) return false;
  return (!f.from || v >= f.from) && (!f.to || v <= f.to);
}
function renderRows() {
  const f = S.filter;
  const q = f.q.trim().toLowerCase();
  // base = 단계 칩을 제외한 모든 필터를 통과한 현장 → 칩의 숫자는 이 기준으로 (필터 걸면 숫자도 같이 바뀜)
  const archivedN = S.computed.filter(r => r.site.archived_at).length;
  const an = $('#archivedN'); if (an) an.textContent = archivedN ? `(${archivedN})` : '';
  const live = S.computed.filter(r => f.showArchived || !r.site.archived_at);
  const hiddenN = S.me.role === 'manager' ? live.filter(hiddenForMe).length : 0;
  const hn = $('#hiddenN'); if (hn) hn.textContent = hiddenN ? `(${hiddenN})` : '';
  const base = live.filter(rec => (f.showDone || !hiddenForMe(rec)) && (!f.unreadOnly || S.unread[rec.site.bm_key]) && (!f.callsOnly || S.calls[rec.site.bm_key])).filter(({ site, c }) =>
    (!q || [site.issue_name, site.owner_name, site.bm_key, site.site_address].some(v => String(v || '').toLowerCase().includes(q)))
    && (!f.state || site.bm_state === f.state)
    && (!f.track || (c && c.track === f.track))
    && (!f.person || [site.manager, site.designer, site.interior].map(x => (x || '').trim()).includes(f.person))
    && inDateRange(site));
  let rows = base.filter(({ c }) => !f.stage || (c && c.currentId === f.stage));

// ----- 담당자 기본 숨김 규칙 -----
// 설계 담당 = 실시도면 완료되면 숨김 / 인테리어 담당 = 설계(AD) 업무 전체 완료되면 숨김 / 영업 = 항상 표시
// 권한이 아니라 기본 필터 — "완료된 현장 보기"로 언제든 볼 수 있음. 소유자·마스터는 적용 안 함.
function myRolesOn(site) {
  const me = (S.me?.staff_name || '').trim(); if (!me) return [];
  const r = [];
  if ((site.manager || '').trim() === me) r.push('영업');
  if ((site.designer || '').trim() === me) r.push('설계');
  if ((site.interior || '').trim() === me) r.push('인테리어');
  return r;
}
function adAllDone(bmKey) {
  const ad = (S.itemsBy[bmKey] || []).filter(i => i.PROCESS === 'AD' && !E.isSkipped(i.STATE));
  return ad.length > 0 && ad.every(i => E.isDone(i.STATE));
}
function hiddenForMe(rec) {
  if (!S.me || S.me.role !== 'manager') return false;
  const roles = myRolesOn(rec.site); if (!roles.length) return false;
  const show = roles.some(r => r === '영업'
    || (r === '설계' && !(rec.c && rec.c.groupStatus.shimDo === 'done'))
    || (r === '인테리어' && !adAllDone(rec.site.bm_key)));
  return !show;
}

// ----- 현장 대화 (직원 간) -----
// 참여자: 영업은 끝까지, 설계는 실시도면 완료 전까지, 인테리어는 설계(AD) 전체 완료 전까지. 단계가 지나면 "나감"으로 표시.
// (역할은 추후 추가 예정 — 여기 배열에 한 줄씩 늘리면 됨)
function chatMembers(rec) {
  const site = rec.site, c = rec.c;
  const designOver = !!(c && c.groupStatus.shimDo === 'done');
  const interiorOver = adAllDone(site.bm_key);
  const nm = v => (v || '').trim();
  return [
    { role: '영업',     name: nm(site.manager),  active: true,         leftNote: '' },
    { role: '설계',     name: nm(site.designer), active: !designOver,  leftNote: '완료' },
    { role: '인테리어', name: nm(site.interior), active: !interiorOver, leftNote: '완료' },
  ].filter(m => m.name && m.name !== '-');
}
function renderMembers(rec, accounts) {
  const ms = chatMembers(rec);
  if (!ms.length) return '<span class="sub">지정된 담당자가 없습니다</span>';
  return ms.map(m => {
    const acc = accounts ? accounts[m.name] : undefined;
    const note = !m.active ? m.leftNote : acc === false ? '앱 미가입' : '';
    return `<span class="mem ${m.active ? 'on' : 'off'}" title="${m.active ? '참여 중' : '담당 업무 완료'}"><span class="dot"></span><span class="rl">${m.role}</span><span class="nm">${esc(m.name)}</span>${note ? `<span class="note">· ${esc(note)}</span>` : ''}</span>`;
  }).join('');
}

// 범위: 📣 호출(항상) + 내 담당 현장 새 메시지(개인 설정). 수신자 판정은 서버(RPC push_recipients), 전송은 Edge Function send-push.
// 안드로이드: Chrome·APK(TWA) / 아이폰: Safari → 홈 화면에 추가한 앱에서만 (iOS 16.4+)
const PUSH_FN = `${SUPABASE_URL}/functions/v1/send-push`;
const PUSH = { reg: null, sub: null, supported: 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window };
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/.test(navigator.userAgent);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const platformOf = () => isIOS ? 'ios' : isAndroid ? 'android' : 'desktop';
const b64ToBytes = s => { const p = '='.repeat((4 - s.length % 4) % 4); const raw = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(raw, c => c.charCodeAt(0)); };
async function pushInit() {
  if (!('serviceWorker' in navigator)) return;
  try { PUSH.reg = await navigator.serviceWorker.register('sw.js'); } catch (e) { console.warn('sw 등록 실패', e); return; }
  navigator.serviceWorker.addEventListener('message', e => { if (e.data?.type === 'open' && e.data.hash) { if (e.data.hash.startsWith('#site/')) S.wantChat = true; location.hash = e.data.hash; if (location.hash === e.data.hash) render(); } });
  if (!PUSH.supported) return;
  PUSH.sub = await PUSH.reg.pushManager.getSubscription().catch(() => null);
  if (PUSH.sub) await pushSave(PUSH.sub);          // 마지막 확인 시각 갱신
  updateBell();
}
function updateBell() {
  const need = PUSH.supported && !PUSH.sub && Notification.permission !== 'denied' && (!isIOS || isStandalone());
  $('#bell')?.classList.toggle('need', need);
}
async function pushSave(sub) {
  if (!S.me) return;
  const j = sub.toJSON();
  const { error } = await sb.from('push_subscriptions').upsert({ user_id: S.me.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, ua: navigator.userAgent.slice(0, 200), platform: platformOf(), last_seen_at: new Date().toISOString() }, { onConflict: 'endpoint' });
  if (error) console.warn('구독 저장 실패', error.message);

}
async function pushEnable() {
  if (!PUSH.supported || !PUSH.reg) throw new Error('이 브라우저는 푸시 알림을 지원하지 않아요');
  if (isIOS && !isStandalone()) throw new Error('아이폰은 홈 화면에 추가한 앱에서만 알림을 켤 수 있어요');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error('알림 권한이 허용되지 않았어요');
  const r = await fetch(PUSH_FN); const { publicKey } = await r.json();
  if (!publicKey) throw new Error('서버 키를 받지 못했어요');

  if (!(await pushSave(PUSH.sub))) throw new Error('구독 정보를 저장하지 못했어요');

}
async function pushForget() {   // 이 기기 구독 해제 (로그아웃·알림 끄기)
  try {
    const sub = PUSH.sub || await PUSH.reg?.pushManager.getSubscription();
    if (!sub) return;
    if (S.me) await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
    await sub.unsubscribe(); PUSH.sub = null; updateBell();
  } catch (e) { console.warn('구독 해제 실패', e); }
}
async function pushTest() {
  const { data, error } = await sb.functions.invoke('send-push', { body: { test: true, endpoint: PUSH.sub?.endpoint || undefined } });
  if (error) throw error;
  return data;
}

  const usageHtml = `<div class="usage">대화 파일 저장소 <b>${usedMB.toFixed(1)}MB</b> / ${limitMB}MB 사용 중 · 한도를 넘으면 가장 오래된 파일부터 자동 삭제됩니다</div>`;
  // 휴일 관리: 이 날짜에는 푸시를 보류하고 다음 근무일 아침 요약으로 묶음 (주말은 자동)
  const hols = holRes.data || [];
  const holHtml = `<details class="card" style="margin-bottom:12px;padding:12px 16px"><summary style="cursor:pointer;font-weight:600">⏰ 휴일 관리 <span class="sub" style="font-weight:400">· 앞으로 ${hols.length}일 등록 · 푸시 알림은 평일 08:00~17:00에만, 등록된 휴일에는 보류</span></summary>
    <div class="tools" style="margin:10px 0 6px"><input type="date" id="holDay"><input type="text" id="holName" placeholder="휴일 이름 (예: 창립기념일)" style="padding:8px 10px;border:1px solid var(--line);border-radius:10px;flex:1 1 160px"><button class="btn sm" id="holAdd">추가</button></div>
    <div id="holList">${hols.length ? hols.map(h => `<div class="dev"><span class="t">${fmtDate(h.day)} <span class="sub" style="display:inline">${['일','월','화','수','목','금','토'][new Date(h.day + 'T00:00:00').getDay()]}</span> · ${esc(h.name)}</span><button class="btn sm" data-hol="${h.day}">삭제</button></div>`).join('') : '<div class="sub">등록된 휴일이 없어요</div>'}</div>
    <div class="sub" style="margin-top:6px">법정 공휴일은 2027년까지 미리 넣어 두었어요. 회사 자체 휴무(근로자의날·창립기념일 등)는 여기서 추가하세요.</div></details>`;
  const pending = S.users.filter(u => u.role === 'pending').length;
  setBadge(pending + S.openFb);
  const roleOpts = u => ['pending','manager','gongmu','pm','admin',...(u.role === 'master' ? ['master'] : []),'blocked'].map(r => `<option value="${r}" ${u.role === r ? 'selected' : ''}>${ROLE_LABEL[r]}</option>`).join('');
  // 가입자가 적은 이름이 Jira 담당자 목록에 없으면 그대로 보여주되 표시해 둠 (소유자가 맞는 Jira 이름으로 바꿔 승인)
  const nameOpts = u => `<option value="">— 없음 —</option>`
    + (u.staff_name && !S.nameOptions.some(o => o.name === u.staff_name) ? `<option value="${esc(u.staff_name)}" selected>${esc(u.staff_name)} (Jira에 없음 — 확인 필요)</option>` : '')
    + S.nameOptions.map(o => `<option value="${esc(o.name)}" ${o.name === u.staff_name ? 'selected' : ''}>${esc(o.name)} (${esc(o.roles)})</option>`).join('');
  $('#main').innerHTML = `${usageHtml}${fbHtml}${holHtml}<div class="notice" style="margin-bottom:12px">가입자가 고른 Jira 이름이 맞는지 확인한 뒤 역할을 바꾸면 승인됩니다. <b>담당자</b>는 본인 현장만, <b>공무·PM·관리자</b>는 전체 현장을 봅니다(공무·PM은 대화방에서 📣 호출 대상). 차단하면 즉시 접근이 막힙니다.</div>
    <table class="list"><thead><tr><th>이름 · 이메일</th><th>Jira 이름</th><th>역할</th><th>알림</th><th>가입</th><th>마지막 로그인</th></tr></thead><tbody>
    ${S.users.map(u => `<tr data-id="${u.id}">
      <td><div class="nm">${esc(u.google_name || '-')}</div><div class="sub">${esc(u.email)}</div></td>
      <td>${u.role === 'owner' ? esc(u.staff_name || '-') : `<select data-f="staff_name">${nameOpts(u)}</select>`}</td>
      <td>${u.role === 'owner' ? '<span class="role owner">소유자</span>' : `<select data-f="role">${roleOpts(u)}</select><span class="saved"></span>`}</td>
      <td>${pushCell(u)}</td>
      <td class="sub">${fmtTime(u.created_at)}</td>
      <td class="sub">${fmtTime(u.last_login_at)}</td>
    </tr>`).join('')}</tbody></table>`;
  document.querySelectorAll('tr[data-id] select').forEach(sel => sel.onchange = async () => {
    const tr = sel.closest('tr'); const id = tr.dataset.id; const u = S.users.find(x => x.id === id);
    const patch = { [sel.dataset.f]: sel.value || null };
    if (sel.dataset.f === 'role' && isApprovedRole(sel.value) && !u.approved_at) { patch.approved_at = new Date().toISOString(); patch.approved_by = S.me.id; }
    const { error } = await sb.from('admin_users').update(patch).eq('id', id);
    const mark = tr.querySelector('.saved'); if (mark) { mark.textContent = error ? '저장 실패' : '저장됨'; mark.style.color = error ? 'var(--red)' : 'var(--green)'; setTimeout(() => mark.textContent = '', 2000); }
    if (!error) { Object.assign(u, patch); setBadge(S.users.filter(x => x.role === 'pending').length + S.openFb); }
  });
  fillShots(fbs);
  document.querySelectorAll('button[data-save]').forEach(b => b.onclick = async () => {
    const box = b.closest('.fb'); const f = fbs.find(x => String(x.id) === b.dataset.save);
    const patch = { status: box.querySelector('select[data-f=status]').value, reply: box.querySelector('input[data-f=reply]').value.trim() || null };
    b.disabled = true;
    const { error } = await sb.from('feedback').update(patch).eq('id', f.id);
    b.disabled = false;
    const mark = box.querySelector('.saved'); mark.textContent = error ? '저장 실패' : (patch.status !== f.status || patch.reply !== f.reply ? '저장됨 · 제보자에게 알림' : '변경 없음'); mark.style.color = error ? 'var(--red)' : 'var(--green)'; setTimeout(() => mark.textContent = '', 3000);
    if (!error) { Object.assign(f, patch); S.openFb = fbs.filter(x => x.status === 'open').length; setBadge(S.users.filter(x => x.role === 'pending').length + S.openFb); }
  });
  $('#holAdd').onclick = async () => {
    const day = $('#holDay').value, name = $('#holName').value.trim();
    if (!day || !name) { alert('날짜와 이름을 입력해 주세요'); return; }
    const { error } = await sb.from('holidays').upsert({ day, name });
    if (error) { alert('저장 실패: ' + error.message); return; }
    renderUsers().then(() => { const d = document.querySelector('details.card'); if (d) d.open = true; });
  };
  document.querySelectorAll('button[data-hol]').forEach(b => b.onclick = async () => {
    if (!confirm(`${fmtDate(b.dataset.hol)} 휴일을 삭제할까요?`)) return;
    const { error } = await sb.from('holidays').delete().eq('day', b.dataset.hol);
    if (error) { alert('삭제 실패: ' + error.message); return; }
    renderUsers().then(() => { const d = document.querySelector('details.card'); if (d) d.open = true; });
  });
}

boot().catch(e => renderMsg('초기화 오류: ' + e.message, true));
</script>
</body>
</html>
