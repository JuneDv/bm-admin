<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공간제작소 관리자</title>
<link rel="icon" href="logo.png">
<style>
  :root {
    --bg:#f4f6fa; --card:#fff; --line:#e3e8f0; --text:#1f2a3a; --mute:#6b7788;
    --navy:#2f4f85; --navy-d:#1f3a5f; --head:#e4ecf7; --green:#5b8a6e; --green-l:#8fbf9f;
    --gray:#b4bcc8; --amber:#e8b765; --red:#c86b6b; --radius:12px;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; font-size:15px; line-height:1.5; }
  a { color:var(--navy); text-decoration:none; }
  button { font:inherit; cursor:pointer; }
  input, select { font:inherit; }
  .hidden { display:none !important; }

  /* ---- 상단 ---- */
  .top { background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  .top .in { max-width:1200px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:14px; }
  .top img { height:30px; display:block; }
  .top .brand { display:flex; align-items:center; gap:8px; text-decoration:none; }
  .top .ttl { font-size:12px; color:var(--mute); font-weight:600; line-height:1.2; }
  .top nav { display:flex; gap:4px; margin-left:12px; }
  .top nav button { border:0; background:transparent; padding:8px 12px; border-radius:8px; color:var(--mute); font-weight:600; }
  .top nav button.on { background:var(--head); color:var(--navy-d); }
  .top nav .badge { display:inline-block; min-width:18px; padding:0 6px; margin-left:4px; border-radius:9px; background:var(--amber); color:#5a4310; font-size:12px; font-weight:700; }
  .top .me { margin-left:auto; display:flex; align-items:center; gap:10px; color:var(--mute); font-size:13px; }
  .top .me b { color:var(--text); }
  .role { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:700; background:var(--head); color:var(--navy-d); }
  .role.master { background:#efe4c8; color:#5a4310; }
  .role.owner { background:#dfe9e2; color:#2f5b40; }
  .lnk { border:0; background:transparent; color:var(--mute); text-decoration:underline; padding:0; }

  .wrap { max-width:1200px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
  .center { max-width:420px; margin:60px auto; text-align:center; }
  .center img { height:48px; margin-bottom:16px; }
  .center h1 { font-size:20px; margin:0 0 8px; color:var(--navy-d); }
  .center p { color:var(--mute); margin:0 0 20px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); background:var(--card); padding:10px 16px; border-radius:10px; font-weight:600; color:var(--text); }
  .btn.primary { background:var(--navy); border-color:var(--navy); color:#fff; }
  .btn.sm { padding:6px 10px; font-size:13px; border-radius:8px; }
  .btn:disabled { opacity:.5; cursor:default; }
  .notice { background:#fff7e3; border:1px solid #f1dfae; color:#5a4310; padding:10px 14px; border-radius:10px; font-size:14px; }
  .err { background:#fbeaea; border:1px solid #efc7c7; color:#7a2e2e; padding:10px 14px; border-radius:10px; font-size:14px; }

  /* ---- 목록 ---- */
  .tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  .tools input[type=search] { flex:1 1 220px; min-width:180px; padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); }
  .tools select { padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); }
  .tools.range { margin-top:-4px; }
  .tools.range input[type=date] { padding:7px 10px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .chip { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:4px 10px; font-size:13px; color:var(--mute); }
  .chip b { color:var(--text); margin-left:4px; }
  .chip.on { background:var(--navy); border-color:var(--navy); color:#fff; } .chip.on b { color:#fff; }
  .count { color:var(--mute); font-size:13px; margin:0 0 8px; }

  table.list { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  table.list th, table.list td { padding:10px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; font-size:14px; }
  table.list th { background:var(--head); color:var(--navy-d); font-weight:700; white-space:nowrap; }
  table.list tr:last-child td { border-bottom:0; }
  table.list tbody tr { cursor:pointer; } table.list tbody tr:hover { background:#f7f9fc; }
  .nm { font-weight:700; } .sub { color:var(--mute); font-size:12px; }
  .dots { display:inline-flex; gap:3px; vertical-align:middle; margin-right:8px; }
  .dots i { width:9px; height:9px; border-radius:50%; background:var(--gray); display:inline-block; }
  .dots i.d { background:var(--green-l); } .dots i.n { background:var(--amber); } .dots i.p { background:repeating-linear-gradient(45deg,var(--green-l) 0 2px,#fff 2px 4px); }
  .st { white-space:nowrap; }
  .pct { font-variant-numeric:tabular-nums; }
  .tag { display:inline-block; padding:1px 7px; border-radius:8px; background:var(--head); color:var(--navy-d); font-size:12px; white-space:nowrap; }
  .tag.site { background:#efe4c8; color:#5a4310; }
  .empty { padding:40px; text-align:center; color:var(--mute); }

  /* ---- 상세 ---- */
  .back { margin-bottom:10px; }
  .grid { display:grid; grid-template-columns:1.2fr .8fr; gap:16px; }
  .h { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .h h2 { margin:0; font-size:20px; color:var(--navy-d); }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:14px; }
  .kv dt { color:var(--mute); white-space:nowrap; } .kv dd { margin:0; }
  .sec { margin-top:14px; } .sec h3 { margin:0 0 8px; font-size:14px; color:var(--mute); font-weight:700; letter-spacing:.02em; }
  .stages { display:flex; flex-direction:column; gap:6px; }
  .stg { display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--card); }
  .stg.now { border-color:var(--amber); background:#fffaf0; } .stg.done { color:var(--mute); }
  .stg .m { width:20px; text-align:center; font-weight:700; } .stg.done .m { color:var(--green); } .stg.now .m { color:#b07d1a; }
  .stg .t { flex:1; font-weight:600; } .stg.done .t { font-weight:500; }
  .stg .c { font-size:12px; color:var(--mute); }
  .stg .c.p { color:#b07d1a; }
  .items { margin:4px 0 0 30px; font-size:13px; color:var(--mute); }
  .items span { display:inline-block; margin-right:10px; }
  .items .ok { color:var(--green); } .items .no { color:var(--red); }
  .proc { border:1px solid var(--line); border-radius:10px; margin-bottom:8px; overflow:hidden; }
  .proc summary { padding:8px 12px; cursor:pointer; font-weight:600; display:flex; gap:10px; align-items:center; background:#fafbfd; }
  .proc summary .s { font-weight:400; color:var(--mute); font-size:13px; margin-left:auto; }
  .proc ul { list-style:none; margin:0; padding:6px 12px 10px; font-size:13px; }
  .proc li { display:flex; justify-content:space-between; gap:10px; padding:3px 0; border-bottom:1px dashed var(--line); } .proc li:last-child { border-bottom:0; }
  .proc li .ok { color:var(--green); } .proc li .now { color:#b07d1a; } .proc li .skip { color:var(--gray); text-decoration:line-through; }
  .pay { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .pay .b { border:1px solid var(--line); border-radius:10px; padding:10px; text-align:center; }
  .pay .b .l { font-size:12px; color:var(--mute); } .pay .b .v { font-weight:700; margin-top:2px; }
  .pay .b.done { background:#eef5f0; border-color:#cfe3d6; } .pay .b.partial { background:#fff7e3; border-color:#f1dfae; }
  .ct { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line); font-size:14px; } .ct:last-child { border-bottom:0; }
  .ct .lb { color:var(--mute); width:64px; } .ct a { margin-left:auto; }

  /* ---- 표 만들기 ---- */
  .tbl-wrap { display:grid; grid-template-columns:1fr 250px; gap:12px; align-items:start; }
  .tbl-bar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:8px; font-size:13px; color:var(--mute); }
  .tbl-bar .sp { flex:1; }
  .tbl-scroll { overflow:auto; max-height:calc(100vh - 290px); border:1px solid var(--line); border-radius:var(--radius); background:var(--card); }
  .tbl-scroll table { border:0; border-radius:0; min-width:100%; }
  .tbl-scroll th { position:sticky; top:0; z-index:1; }
  .tbl-scroll td, .tbl-scroll th { white-space:nowrap; }
  .tbl-scroll tbody tr.sel { background:#fffaf0; }
  .tbl-side { position:sticky; top:64px; }
  .tbl-side .card { padding:12px; }
  .cg { margin-top:10px; } .cg-t { font-size:12px; font-weight:700; color:var(--mute); margin-bottom:4px; letter-spacing:.02em; }
  .cg label { display:block; font-size:13px; padding:2px 0; cursor:pointer; } .cg input { margin-right:6px; }
  .presets { display:flex; flex-wrap:wrap; gap:4px; } .presets .chip { padding:3px 9px; }
  .presets .chip.custom { border-style:dashed; }
  @media (max-width: 820px) {
    .tbl-wrap { grid-template-columns:1fr; } .tbl-side { position:static; }
    .tbl-scroll { max-height:60vh; }
    .tbl-scroll table.list thead { display:table-header-group; }
    .tbl-scroll table.list, .tbl-scroll table.list tbody, .tbl-scroll table.list tr, .tbl-scroll table.list td { display:revert; }
    .tbl-scroll table.list td { padding:8px 10px; border-bottom:1px solid var(--line); }
  }

  /* ---- 대화·배지 ---- */
  .ubadge { display:inline-block; margin-left:6px; padding:0 7px; border-radius:9px; background:var(--amber); color:#5a4310; font-size:12px; font-weight:700; vertical-align:middle; }
  .tog { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--mute); cursor:pointer; white-space:nowrap; }
  .chat .msgs { max-height:380px; overflow:auto; display:flex; flex-direction:column; gap:8px; padding:4px 2px; }
  .msg { max-width:90%; align-self:flex-start; } .msg.mine { align-self:flex-end; text-align:right; }
  .msg .meta { font-size:11px; color:var(--mute); margin-bottom:2px; } .msg .meta .r { background:var(--head); color:var(--navy-d); border-radius:6px; padding:0 5px; }
  .msg .b { display:inline-block; background:#f1f4f9; border-radius:12px; padding:8px 12px; font-size:14px; text-align:left; word-break:break-word; }
  .msg.mine .b { background:var(--navy); color:#fff; }
  .msg .del { border:0; background:transparent; color:var(--mute); cursor:pointer; font-size:13px; padding:0 2px; }
  .day { text-align:center; font-size:11px; color:var(--mute); margin:6px 0 2px; }
  .chat-in { display:flex; gap:6px; margin-top:8px; align-items:flex-end; }
  .chat-in textarea { flex:1; resize:none; padding:8px 10px; border:1px solid var(--line); border-radius:10px; font:inherit; line-height:1.4; }
  .chat-in .btn.icon { padding:8px 10px; }
  .att-pending { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .att-pending .chip { max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .att-pending .chip button { border:0; background:transparent; color:var(--mute); margin-left:4px; cursor:pointer; }
  .att-opt { font-size:12px; color:var(--mute); margin-top:4px; display:flex; gap:10px; align-items:center; }
  .att { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .msg.mine .att { justify-content:flex-end; }
  .att img { width:120px; height:120px; object-fit:cover; border-radius:10px; border:1px solid var(--line); display:block; }
  .att .file { display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border:1px solid var(--line); border-radius:10px; background:#fff; font-size:13px; color:var(--text); max-width:260px; }
  .att .file span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .att .gone { font-size:12px; color:var(--mute); border:1px dashed var(--line); border-radius:10px; padding:6px 10px; }
  .usage { font-size:13px; color:var(--mute); margin-bottom:10px; } .usage b { color:var(--text); }

  /* ---- 관리자 관리 ---- */
  table.list td select { padding:5px 8px; border:1px solid var(--line); border-radius:8px; background:var(--card); }
  .saved { color:var(--green); font-size:12px; margin-left:6px; }

  @media (max-width: 820px) {
    .grid { grid-template-columns:1fr; }
    table.list thead { display:none; }
    table.list, table.list tbody, table.list tr, table.list td { display:block; }
    table.list tr { border-bottom:1px solid var(--line); padding:8px 4px; }
    table.list td { border:0; padding:3px 8px; }
    table.list td.hide-m { display:none; }
    .top nav button { padding:8px 8px; }
    .top .me span.email { display:none; }
  }
</style>
</head>
<body>

<header class="top hidden" id="top">
  <div class="in">
    <a class="brand" href="#sites" title="현장 목록으로"><img src="logo.png" alt="공간제작소"><span class="ttl" id="brandRole">관리자</span></a>
    <nav>
      <button id="navSites" class="on" onclick="go('#sites')">현장 목록</button>
      <button id="navUsers" class="hidden" onclick="go('#users')">관리자 관리<span class="badge hidden" id="pendingBadge"></span></button>
    </nav>
    <div class="me">
      <span id="syncInfo" class="sub"></span>
      <span><b id="meName"></b> <span class="email" id="meEmail"></span></span>
      <button class="lnk" onclick="signOut()">로그아웃</button>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="center card" id="loading"><p>불러오는 중…</p></div>
</main>

<script src="stage-engine.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://ljxonejavjagwqrorfui.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fWTsacLqOMhAV9VOeTPy5Q_Elvgx8Fn';   // 공개용 키 — RLS로 보호됨
const OWNER_APP_URL = 'https://bm-status-app.vercel.app';
const JIRA_URL = 'https://gg-arch.atlassian.net/browse/';
const E = window.StageEngine;

const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const won = n => { n = Math.round(Number(n) || 0); if (!n) return '-'; const eok = Math.floor(n/1e8), man = Math.floor((n%1e8)/1e4); if (eok) return man ? `${eok}억 ${man.toLocaleString()}만` : `${eok}억`; return man ? `${man.toLocaleString()}만` : n.toLocaleString() + '원'; };
const fmtDate = s => s ? String(s).slice(0,10).replace(/-/g,'.') : '-';
const fmtTime = iso => iso ? new Date(iso).toLocaleString('ko-KR', { timeZone:'Asia/Seoul', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }) : '-';
const fmtPhone = p => { const d = String(p||'').replace(/[^0-9]/g,''); return d.length === 11 ? `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}` : d.length === 10 ? `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}` : d; };
const ROLE_LABEL = { pending:'승인 대기', manager:'담당자', master:'마스터', owner:'소유자', blocked:'차단' };

// ---------- DB 행 → 판정 엔진 입력(시트 컬럼 형식) ----------
const s = v => (v === null || v === undefined) ? '' : String(v);
const toRow = r => ({
  'BM KEY': r.bm_key, 'ISSUE NAME': s(r.issue_name), 'SITE': s(r.site_address), 'NAME': s(r.owner_name),
  'PHONE NUM.': (r.phones || []).join(', '), 'MANAGER': s(r.manager), 'DESIGN': s(r.designer), 'INTERIOR': s(r.interior),
  'BM STATE': s(r.bm_state), '계약일': s(r.contract_date), '희망입주일': s(r.movein_date), '제작처': s(r.factory_type),
  '상차일': s(r.ship_date), '착공일': s(r.start_date),
  '공사비_총액': s(r.cost_total), '공사비_수금액': s(r.cost_paid), '공사비_수금율': s(r.cost_pct),
  '설계비_총액': s(r.design_total), '설계비_수금액': s(r.design_paid), '설계비_수금율': s(r.design_pct),
});
const toStage = i => ({ 'BM KEY': i.bm_key, 'PROCESS': i.process, 'STAGE KEY': i.stage_key, 'STAGE NAME': s(i.name), 'STATE': s(i.state), 'SEQ': s(i.seq) });

// ---------- 상태 ----------
const S = { user:null, me:null, sites:[], itemsBy:{}, staff:{}, computed:[], lastSync:null, users:[], nameOptions:[], filter:{ q:'', stage:'', state:'', track:'', person:'', sort:'ship' },
  table: { on:false, cols:new Set(['issue_name','owner_name','phones','bm_state','stage','cost_pct','manager']), selected:new Set() } };
S.filter.dateField = 'contract_date'; S.filter.from = ''; S.filter.to = '';
S.filter.showDone = false; S.filter.unreadOnly = false;      // 담당자: 완료된 현장 보기 / 새 메시지 있는 현장만
S.unread = {};                                                // bm_key → 안 읽은 메시지 수
S.chat = { bmKey: null, messages: [], timer: null };
const DATE_FIELDS = [['contract_date','계약일'],['start_date','착공일'],['ship_date','상차일'],['movein_date','희망입주일']];

// ---------- 라우팅 ----------
window.go = h => { location.hash = h; };
window.addEventListener('hashchange', render);

// ---------- 인증 ----------
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  S.user = session?.user || null;
  sb.auth.onAuthStateChange((_e, sess) => { const was = !!S.user; S.user = sess?.user || null; if (!!S.user !== was) afterAuth(); });
  await afterAuth();
}
async function afterAuth() {
  if (!S.user) { S.me = null; $('#top').classList.add('hidden'); renderLogin(); return; }
  const { data: me, error } = await sb.from('admin_users').select('*').eq('id', S.user.id).maybeSingle();
  if (error || !me) { renderMsg('계정 정보를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.', true); return; }
  S.me = me;
  sb.rpc('touch_login').then(() => {});
  if (!['manager','master','owner'].includes(me.role)) { $('#top').classList.add('hidden'); await renderPending(); return; }
  $('#top').classList.remove('hidden');
  $('#meName').textContent = me.google_name || me.staff_name || '';
  $('#meEmail').textContent = me.email;
  $('#brandRole').textContent = ROLE_LABEL[me.role] + (me.staff_name ? ` · ${me.staff_name}` : '');
  $('#navUsers').classList.toggle('hidden', me.role !== 'owner');
  await loadData();
  if (!location.hash || location.hash === '#login') location.hash = '#sites';
  render();
}
window.signIn = async () => {
  const { error } = await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.origin + location.pathname } });
  if (error) renderMsg('로그인을 시작하지 못했습니다: ' + error.message, true);
};
window.signOut = async () => { await sb.auth.signOut(); location.hash = ''; };

// ---------- 데이터 ----------
async function loadData() {
  const [sitesRes, staffRes, runRes] = await Promise.all([
    sb.from('sites').select('*').order('issue_name'),
    sb.from('staff').select('name, phone'),
    sb.from('sync_runs').select('started_at, finished_at, sites, items').order('id', { ascending:false }).limit(1),
  ]);
  S.sites = sitesRes.data || [];
  S.staff = Object.fromEntries((staffRes.data || []).map(r => [r.name, r.phone]));
  S.lastSync = runRes.data?.[0] || null;
  // 세부공정: 1,000행씩 페이지로 전부 읽기 (RLS가 담당 현장 것만 돌려줌)
  const items = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from('stage_items').select('bm_key, process, stage_key, name, state, seq').order('stage_key').range(from, from + 999);
    if (error || !data?.length) break;
    items.push(...data);
    if (data.length < 1000) break;
  }
  S.itemsBy = {};

  if (btn) { const o = btn.textContent; btn.textContent = okLabel || '복사됨 ✓'; setTimeout(() => btn.textContent = o, 1500); }
}
function downloadCSV(text, name) {
  const blob = new Blob(['﻿' + text], { type:'text/csv;charset=utf-8' }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function closeChat() { if (S.chat.timer) clearInterval(S.chat.timer); S.chat.timer = null; S.chat.bmKey = null; S.chat.messages = []; S.chat.urls = {}; S.chat.pending = []; }
const BUCKET = 'chat-files', MAX_FILE = 10 * 1024 * 1024, IMG_MAX_EDGE = 1600, IMG_QUALITY = 0.85;
const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(b / 1024)) + 'KB';
const isImg = f => /^image\//.test(f.type || '');
// 사진 축소: 긴 변 IMG_MAX_EDGE, JPEG. 결과가 원본보다 크거나 원본이 이미 작으면 원본 유지
async function shrinkImage(file, maxEdge = IMG_MAX_EDGE, quality = IMG_QUALITY) {
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, maxEdge / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
    if (scale === 1 && file.size < 400 * 1024) return { blob: file, width: bmp.width, height: bmp.height, type: file.type };
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', quality));
    if (!blob || blob.size >= file.size) return { blob: file, width: bmp.width, height: bmp.height, type: file.type };
    return { blob, width: w, height: h, type: 'image/jpeg', renamed: file.name.replace(/\.[^.]+$/, '') + '.jpg' };
  } catch { return { blob: file, type: file.type }; }

    </div>

      <div class="card chat"><h3 style="margin:0 0 8px;font-size:14px;color:var(--mute)">현장 대화 <span class="sub" style="font-weight:400">· 영업·설계·인테리어 담당자만 볼 수 있어요</span></h3>
        <div class="msgs" id="msgs"><div class="sub">불러오는 중…</div></div>
        <div class="chat-in">
          <button class="btn sm icon" id="attBtn" title="사진·파일 첨부 (파일당 10MB)">📎</button>
          <input type="file" id="attInp" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.hwp,.hwpx,.zip,.txt,.dwg" class="hidden">
          <textarea id="msgInp" rows="2" maxlength="2000" placeholder="메시지 입력 (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
          <button class="btn primary sm" id="msgSend">보내기</button>
        </div>
        <div class="att-pending" id="attPending"></div>
        <div class="att-opt hidden" id="attOpt"><label><input type="checkbox" id="attOrig"> 사진 원본 그대로 올리기 (기본은 긴 변 1600px로 축소)</label></div>
      </div>
      <div class="card" style="margin-top:16px"><h3 style="margin:0 0 10px;font-size:14px;color:var(--mute)">공사비</h3>
        <dl class="kv"><dt>총액</dt><dd>${won(site.cost_total)}</dd><dt>수금액</dt><dd>${won(site.cost_paid)} <span class="sub">(${site.cost_pct != null ? Number(site.cost_pct).toFixed(1) : '-'}%)</span></dd></dl>
        ${pay ? `<div class="pay" style="margin-top:10px">${pay.items.map(i => `<div class="b ${i.status}"><div class="l">${i.label} ${Math.round(i.ratio * 100)}%</div><div class="v">${i.status === 'done' ? '완료' : i.status === 'partial' ? '일부' : '대기'}</div><div class="sub">${won(i.planned)}</div></div>`).join('')}</div>` : ''}
        ${site.design_total ? `<dl class="kv" style="margin-top:12px"><dt>설계비</dt><dd>${won(site.design_total)} · 수금 ${won(site.design_paid)} (${site.design_pct != null ? Number(site.design_pct).toFixed(0) : '-'}%)</dd></dl>` : ''}
      </div>
      <div class="card" style="margin-top:16px"><h3 style="margin:0 0 6px;font-size:14px;color:var(--mute)">담당자</h3>
        <div class="ct"><span class="lb">영업</span>${esc(site.manager || '-')}${staffTel(site.manager)}</div>
        <div class="ct"><span class="lb">설계</span>${esc(site.designer || '-')}${staffTel(site.designer)}</div>
        <div class="ct"><span class="lb">인테리어</span>${esc(site.interior || '-')}${staffTel(site.interior)}</div>
      </div>
      <div class="card" style="margin-top:16px"><h3 style="margin:0 0 6px;font-size:14px;color:var(--mute)">공종 키</h3>
        <dl class="kv">${[['AD','ad'],['OFB','ofb'],['FC','fc'],['COS','cos'],['IOS','ios'],['ASOS','asos']].filter(([,k]) => site[k + '_key']).map(([p, k]) => `<dt>${p}</dt><dd><a href="${JIRA_URL}${esc(site[k + '_key'])}" target="_blank" rel="noopener">${esc(site[k + '_key'])}</a> <span class="sub">${esc(site[k + '_state'] || '')}</span></dd>`).join('') || '<dd class="sub">연결된 공종 없음</dd>'}</dl>
      </div>
    </div>
  </div>`;
  window.scrollTo(0, 0);
  openChat(site);
}

// ----- 관리자 관리 (소유자) -----
async function renderUsers() {
  const [{ data: users }, nameRes, usageRes] = await Promise.all([
    sb.from('admin_users').select('*').order('created_at', { ascending:false }),
    S.nameOptions.length ? Promise.resolve({ data: S.nameOptions }) : sb.rpc('staff_name_options'),
    sb.rpc('storage_usage'),
  ]);
  S.users = users || []; S.nameOptions = nameRes.data || [];
  const usedMB = Number(usageRes.data || 0) / 1048576, limitMB = 900;
  const usageHtml = `<div class="usage">대화 파일 저장소 <b>${usedMB.toFixed(1)}MB</b> / ${limitMB}MB 사용 중 · 한도를 넘으면 가장 오래된 파일부터 자동 삭제됩니다</div>`;
  const pending = S.users.filter(u => u.role === 'pending').length;
  $('#pendingBadge').textContent = pending; $('#pendingBadge').classList.toggle('hidden', !pending);
  const roleOpts = u => ['pending','manager','master','blocked'].map(r => `<option value="${r}" ${u.role === r ? 'selected' : ''}>${ROLE_LABEL[r]}</option>`).join('');
  // 가입자가 적은 이름이 Jira 담당자 목록에 없으면 그대로 보여주되 표시해 둠 (소유자가 맞는 Jira 이름으로 바꿔 승인)
  const nameOpts = u => `<option value="">— 없음 —</option>`
    + (u.staff_name && !S.nameOptions.some(o => o.name === u.staff_name) ? `<option value="${esc(u.staff_name)}" selected>${esc(u.staff_name)} (Jira에 없음 — 확인 필요)</option>` : '')
    + S.nameOptions.map(o => `<option value="${esc(o.name)}" ${o.name === u.staff_name ? 'selected' : ''}>${esc(o.name)} (${esc(o.roles)})</option>`).join('');
  $('#main').innerHTML = `${usageHtml}<div class="notice" style="margin-bottom:12px">가입자가 고른 Jira 이름이 맞는지 확인한 뒤 역할을 <b>담당자</b>(본인 현장만) 또는 <b>마스터</b>(전체 현장)로 바꾸면 승인됩니다. 차단하면 즉시 접근이 막힙니다.</div>
    <table class="list"><thead><tr><th>이름 · 이메일</th><th>Jira 이름</th><th>역할</th><th>가입</th><th>마지막 로그인</th></tr></thead><tbody>
    ${S.users.map(u => `<tr data-id="${u.id}">
      <td><div class="nm">${esc(u.google_name || '-')}</div><div class="sub">${esc(u.email)}</div></td>
      <td>${u.role === 'owner' ? esc(u.staff_name || '-') : `<select data-f="staff_name">${nameOpts(u)}</select>`}</td>
      <td>${u.role === 'owner' ? '<span class="role owner">소유자</span>' : `<select data-f="role">${roleOpts(u)}</select><span class="saved"></span>`}</td>
      <td class="sub">${fmtTime(u.created_at)}</td>
      <td class="sub">${fmtTime(u.last_login_at)}</td>
    </tr>`).join('')}</tbody></table>`;
  document.querySelectorAll('tr[data-id] select').forEach(sel => sel.onchange = async () => {
    const tr = sel.closest('tr'); const id = tr.dataset.id; const u = S.users.find(x => x.id === id);
    const patch = { [sel.dataset.f]: sel.value || null };
    if (sel.dataset.f === 'role' && ['manager','master'].includes(sel.value) && !u.approved_at) { patch.approved_at = new Date().toISOString(); patch.approved_by = S.me.id; }
    const { error } = await sb.from('admin_users').update(patch).eq('id', id);
    const mark = tr.querySelector('.saved'); if (mark) { mark.textContent = error ? '저장 실패' : '저장됨'; mark.style.color = error ? 'var(--red)' : 'var(--green)'; setTimeout(() => mark.textContent = '', 2000); }
    if (!error) { Object.assign(u, patch); const p = S.users.filter(x => x.role === 'pending').length; $('#pendingBadge').textContent = p; $('#pendingBadge').classList.toggle('hidden', !p); }
  });
}

boot().catch(e => renderMsg('초기화 오류: ' + e.message, true));
</script>
